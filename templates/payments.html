{% include "header.html" %}
<!-- main content -->
<div class="container-fluid " style = "margin-top:100px">
      <div class="row justify-content-md-center container d-flex mx-auto">
      <h1 data-translator-en="Unpaid Orders" data-translator-es="Pedidos Sin Pagar">Unpaid Orders</h1>
    </div>
    <div class="row justify-content-md-center">
      <div class="table-responsive" style="padding-left: 10%;padding-right: 10%;">
        <table class="table table-hover">
          <thead>
            <tr>
              <th data-translator-en="Date" data-translator-es="Fecha">Date</th>
              <th data-translator-en="Client" data-translator-es="Cliente">Client</th>
              <th data-translator-en="Price" data-translator-es="Precio">Price</th>
              <th data-translator-en="Paid" data-translator-es="Pagado">Paid</th>
            </tr>
          </thead>
          <tbody>
          <form method="POST" action="{{ url_for('payments') }}">
          {{ form.csrf_token() }}
          {% for i in delivered_orders%}
            <tr>
              <td>{{ delivered_orders.date }}</td>
              <td>{{ delivered_orders.customer }}</td>
              <td>{{ delivered_orders.price }}€</td>
              <td>{{ delivered_orders.form_data }}</td>
            </tr>
          {% endfor %}
          <tr>
            <td><button class ="btn btn-dark"><a class="nav-link text-white" href="{{ url_for('future_payments') }}" data-translator-en="Future Payments" data-translator-es="Pagos Futuros">Future Payments</a></td>
            <td></td>
            <td></td>
            <td><input type="submit" value="Mark as Paid" class="btn btn-dark" data-translator-en="Mark as Paid" data-translator-es="Marcar como Pagado"></td>
          </tr>
          </form>
          </tbody>
        </table>
     </div>
    </div>
</div>
<!-- footer -->
{% include "footer.html" %}
