{% include "header.html" %}

<div class="container-fluid position-relative" style="margin-top: 100px;">
  <div class="container text-center" style="max-width: 600px;">
    <div class="card p-4 shadow-sm">
      {% if success %}
        <div class="mb-3 text-success">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle" viewBox="0 0 16 16">
            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
            <path d="m10.97 4.97-.02.022-3.473 4.425-2.093-2.094a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05"/>
          </svg>
        </div>
        <h3 class="text-success mb-3" data-translator-en="Verification Successful" data-translator-es="Verificación Exitosa">Verification Successful</h3>
        <p class="lead">{{ message }}</p>
        <div class="mt-4">
          <a href="{{ url_for('index') }}" class="btn btn-dark" data-translator-en="Order Bread" data-translator-es="Pedir Pan">Order Bread</a>
          <a href="{{ url_for('user_settings') }}" class="btn btn-outline-secondary ms-2" data-translator-en="Settings" data-translator-es="Configuración">Settings</a>
        </div>
      {% else %}
        <div class="mb-3 text-danger">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-x-circle" viewBox="0 0 16 16">
            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
          </svg>
        </div>
        <h3 class="text-danger mb-3" data-translator-en="Verification Failed" data-translator-es="Verificación Fallida">Verification Failed</h3>
        <p class="lead">{{ message }}</p>
        <div class="mt-4">
          <a href="{{ url_for('user_settings') }}" class="btn btn-dark" data-translator-en="Go to Settings" data-translator-es="Ir a Configuración">Go to Settings</a>
        </div>
      {% endif %}
    </div>
  </div>
</div>

{% include "footer.html" %}
