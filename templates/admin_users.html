{% include "header.html" %}
<!-- main content -->
<div class="container-fluid " style = "margin-top:100px">
  <div class="row justify-content-md-center container d-flex mx-auto">
    <h1 data-translator-en="Users" data-translator-es="Usuarios">Users</h1>
  </div>
  <!-- Search Box -->
  <div class="row justify-content-md-center" style="margin-bottom: 20px;">
    <div style="width: 90%; max-width: 600px;">
      <div class="input-group">
        <input 
          type="text" 
          class="form-control" 
          id="users-search" 
          placeholder="Search users..."
          data-translator-placeholder-en="Search users by name or group..."
          data-translator-placeholder-es="Buscar usuarios por nombre o grupo...">
        <button class="btn btn-outline-secondary" type="button" id="clear-users-search" data-translator-en="Clear" data-translator-es="Limpiar">Clear</button>
      </div>
    </div>
  </div>
  <div class="row justify-content-md-center">
    <div class="table-responsive" style="padding-left: 10%;padding-right: 10%;">
      <table class="table table-hover" id="users-table">
        <thead>
          <tr>
            <th data-translator-en="User id" data-translator-es="ID de usuario">User id</th>
            <th data-translator-en="User Name" data-translator-es="Nombre de usuario">User Name</th>
            <th data-translator-en="Verified" data-translator-es="Verificado">VErified</th>
            <th data-translator-en="User Group" data-translator-es="Grupo">User Group</th>
            <!--th>User Address</th-->
            <th data-translator-en="User date" data-translator-es="Fecha">User date</th>
          </tr>
        </thead>
        <tbody>
          {% for i in users%}
          <tr>
            <td>{{ i.id }}</td>
            <td>{{ i.username }}</td>
            <td>{{ i.verified }}</td>
            <td>{{ i.group }}</td>
            <!--td>{{ i.address }}</td-->
            <td>{{ i.date }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
<div class="container d-flex justify-content-center">
  <form method="POST" action="{{ url_for('baker_users') }}">
    {{ form.csrf_token() }}
    <div class>{{ form.users_to_delete}}
    </div>
    <div class="mx-auto" style="height: 10px;">
    </div>
    <div class="justify-content-center container d-flex"><input type="submit" value="Delete" class="btn btn-dark" data-translator-en="Delete" data-translator-es="Eliminar">
    </div>
  </form>
</div>
</div>

<!-- Search and Filter Script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('users-search');
  const clearBtn = document.getElementById('clear-users-search');
  const table = document.getElementById('users-table');
  
  if (searchInput && table) {
    searchInput.addEventListener('input', function() {
      const query = this.value.toLowerCase();
      const rows = table.querySelectorAll('tbody tr');
      
      rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        let match = false;
        
        // Search in username (index 1) and group (index 3)
        if (cells.length >= 4) {
          const username = cells[1].textContent.toLowerCase();
          const group = cells[3].textContent.toLowerCase();
          
          if (username.includes(query) || group.includes(query)) {
            match = true;
          }
        }
        
        row.style.display = match ? '' : 'none';
      });
    });
  }
  
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      searchInput.value = '';
      searchInput.dispatchEvent(new Event('input'));
    });
  }
});
</script>
